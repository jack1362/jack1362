<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Jack Lenhart — Software Engineer</title>
  <desc id="desc">A dark portfolio banner with blue and purple accents.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="0.55" stop-color="#8250df"/>
      <stop offset="1" stop-color="#bf4b8a"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#30363d" stroke-width="1" opacity=".5"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#surface)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect x="0" y="0" width="12" height="300" rx="6" fill="url(#accent)"/>
  <circle cx="1040" cy="80" r="120" fill="#2f81f7" opacity=".12" filter="url(#glow)"/>
  <circle cx="1110" cy="250" r="150" fill="#a371f7" opacity=".12" filter="url(#glow)"/>

  <g transform="translate(72 72)">
    <text x="0" y="52" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="700" letter-spacing="-2">Jack Lenhart</text>
    <text x="2" y="98" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">Software Engineer · Computer Science @ University of Florida</text>
    <rect x="2" y="128" width="520" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="2" y="166" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17">production systems  ·  developer tools  ·  real-time software</text>
  </g>

  <g transform="translate(870 75)" fill="none" stroke-linecap="round">
    <path d="M45 8 10 75l35 67" stroke="#58a6ff" stroke-width="9"/>
    <path d="m145 8 35 67-35 67" stroke="#a371f7" stroke-width="9"/>
    <path d="m120 0-50 150" stroke="#f778ba" stroke-width="9"/>
  </g>

  <rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="#30363d" stroke-width="2"/>
</svg>